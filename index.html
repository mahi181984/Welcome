<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Image Toggle</title>

<style>

html, body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    touch-action:manipulation;
    -webkit-user-select:none;
    user-select:none;
}

#toggleImg{
    width:100%;
    height:100%;
    object-fit:contain;
}

#backBtn{
    position:fixed;
    right:20px;
    bottom:20px;

    width:45px;
    height:45px;

    border:none;
    border-radius:50%;

    background:#7ED6FF;
    color:#003366;

    font-size:24px;
    font-weight:bold;

    display:flex;
    justify-content:center;
    align-items:center;

    cursor:pointer;

    box-shadow:0 4px 10px rgba(0,0,0,.4);
}

#backBtn:active{
    transform:scale(.9);
}

</style>
</head>

<body>

<img id="toggleImg" src="image15.png" alt="Image">

<button id="backBtn">&#8592;</button>

<audio id="clapSound" preload="auto">
    <source src="clap.mp3" type="audio/mpeg">
</audio>

<script>

const img = document.getElementById("toggleImg");
const backBtn = document.getElementById("backBtn");
const clap = document.getElementById("clapSound");

let changed = false;

function feedback(){

    // Vibration (Android-supported browsers)
    if ("vibrate" in navigator){
        navigator.vibrate(40);
    }

    // Play clap sound
    clap.currentTime = 0;
    clap.play().catch(()=>{});
}

// Touch image
img.addEventListener("pointerdown", function(e){

    e.preventDefault();

    feedback();

    if(!changed){
        img.src = "image25.png";
        changed = true;
    }

});

// Back button
backBtn.addEventListener("pointerdown", function(e){

    e.preventDefault();

    feedback();

    img.src = "image15.png";
    changed = false;

});

</script>

</body>
</html>
