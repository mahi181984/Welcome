<script>

const img = document.getElementById("toggleImg");
const refreshBtn = document.getElementById("refreshBtn");

let changed = false;

// Vibrate whenever the screen is touched
document.addEventListener("pointerdown", function () {

    if (navigator.vibrate) {
        navigator.vibrate(30);   // 30 ms vibration
    }

}, { passive: true });

// Image touch
img.addEventListener("pointerdown", function () {

    if (!changed) {
        img.src = "image25.png";
        changed = true;
    }

});

// Refresh button
refreshBtn.addEventListener("pointerdown", function () {

    img.src = "image15.png";
    changed = false;

});

</script>
